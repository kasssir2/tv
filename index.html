<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT-play FOSS Light</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #0b0b0c; color: #e1e1e3; font-family: Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 340px; background: #131316; border-right: 1px solid #232329; display: flex; flex-direction: column; z-index: 10; }
        .header-box { padding: 20px; background: #1a1a22; text-align: center; font-weight: bold; border-bottom: 1px solid #232329; font-size: 16px; color: #00a2ff; }
        .config-box { padding: 15px; background: #16161d; border-bottom: 1px solid #232329; display: flex; flex-direction: column; gap: 10px; }
        input[type="text"], select, input[type="file"] { background: #202026; color: #fff; border: 1px solid #33333f; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; width: calc(100% - 22px); }
        button { background: #00a2ff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        #channels-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .channel-item { padding: 14px 20px; border-bottom: 1px solid #1c1c24; cursor: pointer; display: flex; align-items: center; font-size: 14px; color: #b5b5bd; }
        .channel-item.active { background: #00a2ff; color: #fff; font-weight: bold; }
        #video-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-box">OTT-PLAY FOSS LIGHT</div>
        <div class="config-box">
            <input type="text" id="playlist-url" placeholder="Вставьте ссылку на .m3u / .m3u8">
            <button onclick="loadFromUrl()">Загрузить по ссылке</button>
            <input type="file" id="playlist-file" accept=".m3u,.m3u8" onchange="loadFromFile(this)">
            <select id="category-select" style="display:none;" onchange="filterCategory(this.value)"></select>
        </div>
        <ul id="channels-list"><li class="channel-item">Плейлист не загружен</li></ul>
    </div>

    <div id="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = null;
        let allChannels = [];

        window.onload = function() {
            const savedUrl = localStorage.getItem('ott_foss_url');
            if (savedUrl) {
                document.getElementById('playlist-url').value = savedUrl;
                loadFromUrl(savedUrl);
            }
        };

        async function loadFromUrl(forcedUrl = null) {
            const url = forcedUrl || document.getElementById('playlist-url').value.trim();
            if (!url) return alert('Введите ссылку!');
            localStorage.setItem('ott_foss_url', url);
            updateStatus('Загрузка...');

            // Используем ультра-надежный CORS шлюз
            const proxyUrl = 'https://allorigins.win' + encodeURIComponent(url);
            try {
                const response = await fetch(proxyUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                updateStatus('Ошибка сети. Загрузите файл напрямую.');
            }
        }

        function loadFromFile(input) {
            const file = input.files[0];
            if (!file) return;
            updateStatus('Чтение файла...');
            const reader = new FileReader();
            reader.onload = function(e) { parseM3U(e.target.result); };
            reader.readAsText(file);
        }

        function updateStatus(text) {
            document.getElementById('channels-list').innerHTML = `<li class="channel-item">${text}</li>`;
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const groups = new Set();
            allChannels = [];
            let currentName = '';
            let currentGroup = 'Общие';

            lines.forEach(line => {
                line = line.trim();
                if (line.toUpperCase().startsWith('#EXTINF:')) {
                    // Всеядный поиск имени канала
                    const commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) currentName = line.substring(commaIdx + 1).trim();
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch) currentGroup = groupMatch[1];
                } else if (line.toUpperCase().startsWith('#EXTGRP:')) {
                    currentGroup = line.substring(8).trim();
                } else if (line.startsWith('http')) {
                    allChannels.push({ n: currentName || 'Канал', g: currentGroup, u: line });
                    if (currentGroup) groups.add(currentGroup);
                    currentName = '';
                }
            });

            if (allChannels.length === 0) {
                updateStatus('Ошибка формата. Загрузите файл плейлиста.');
                return;
            }

            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="ALL">-- ВСЕ КАНАЛЫ --</option>';
            groups.forEach(g => { const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase(); select.appendChild(opt); });
            select.style.display = 'block';
            filterCategory('ALL');
        }

        function filterCategory(category) {
            const listContainer = document.getElementById('channels-list');
            listContainer.innerHTML = '';
            const filtered = category === 'ALL' ? allChannels : allChannels.filter(item => item.g === category);
            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerText = item.n;
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(item.u);
                };
                listContainer.appendChild(li);
            });
        }

        function playStream(url) {
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }
    </script>
</body>
</html>
