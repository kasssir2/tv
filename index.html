<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT-PLAYER MASX CLONE</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #141414; color: #fff; font-family: Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #1f1f1f; border-right: 2px solid #333; display: flex; flex-direction: column; z-index: 10; }
        .header-box { padding: 15px; background: #292929; text-align: center; font-weight: bold; border-bottom: 1px solid #444; font-size: 18px; color: #0088cc; }
        .nav-box { padding: 10px; background: #222; border-bottom: 1px solid #333; display: flex; gap: 5px; }
        select { flex: 1; background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; cursor: pointer; }
        #channels-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .channel-item { padding: 12px 20px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; align-items: center; transition: 0.15s; font-size: 14px; }
        .channel-item:hover, .channel-item.active { background: #0056b3; color: #fff; font-weight: bold; }
        #video-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-box">OTT-PLAYER WIDGET</div>
        <div class="nav-box">
            <select id="category-select" onchange="filterCategory(this.value)">
                <option value="ALL">-- Все категории --</option>
            </select>
        </div>
        <ul id="channels-list">
            <li class="channel-item">Загрузка плейлиста...</li>
        </ul>
    </div>

    <div id="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = null;
        let allChannels = [];

        // Ссылка на ваш оригинальный самообновляемый плейлист
        const M3U_URL = "http://mylistbest.net";

        window.onload = function() {
            fetchPlaylist();
        };

        async function fetchPlaylist() {
            try {
                // Прямой обход CORS блокировок через самый быстрый прокси
                const proxyUrl = 'https://allorigins.win' + encodeURIComponent(M3U_URL);
                const response = await fetch(proxyUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                document.getElementById('channels-list').innerHTML = '<li class="channel-item" style="color:red">Ошибка сети. Попробуйте обновить страницу.</li>';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const groups = new Set();
            allChannels = [];
            
            let currentName = '';
            let currentGroup = 'другие';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1] || 'Без названия';
                } else if (line.startsWith('#EXTGRP:')) {
                    currentGroup = line.replace('#EXTGRP:', '').trim();
                } else if (line.startsWith('http')) {
                    allChannels.push({ n: currentName || 'Канал', g: currentGroup, u: line });
                    if(currentGroup) groups.add(currentGroup);
                    currentName = ''; // Сброс
                }
            });

            // Строим категории в меню
            const select = document.getElementById('category-select');
            groups.forEach(group => {
                const opt = document.createElement('option');
                opt.value = group;
                opt.innerText = group.toUpperCase();
                select.appendChild(opt);
            });

            filterCategory('ALL');
        }

        function filterCategory(category) {
            const listContainer = document.getElementById('channels-list');
            listContainer.innerHTML = '';

            const filtered = category === 'ALL' 
                ? allChannels 
                : allChannels.filter(item => item.g === category);

            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerText = item.n;
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(item.u);
                };
                listContainer.appendChild(li);
            });
        }

        function playStream(url) {
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            } else {
                alert('Формат не поддерживается');
            }
        }
    </script>
</body>
</html>
