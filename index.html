<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT-PLAYER MASX CLONE</title>
    <!-- Исправленное и точное подключение библиотеки видео-движка -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #141414; color: #fff; font-family: Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #1f1f1f; border-right: 2px solid #333; display: flex; flex-direction: column; z-index: 10; }
        .header-box { padding: 15px; background: #292929; text-align: center; font-weight: bold; border-bottom: 1px solid #444; font-size: 18px; color: #0088cc; }
        .nav-box { padding: 10px; background: #222; border-bottom: 1px solid #333; display: flex; gap: 5px; }
        select { flex: 1; background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; cursor: pointer; }
        #channels-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .channel-item { padding: 12px 20px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; align-items: center; transition: 0.15s; font-size: 14px; }
        .channel-item:hover, .channel-item.active { background: #0056b3; color: #fff; font-weight: bold; }
        #video-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-box">OTT-PLAYER WIDGET</div>
        <div class="nav-box">
            <select id="category-select" onchange="filterCategory(this.value)">
                <option value="ALL">-- Все категории --</option>
            </select>
        </div>
        <ul id="channels-list"></ul>
    </div>

    <div id="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        // Все ссылки восстановлены в исходном виде с вашим токеном доступа
        const RAW_PLAYLIST = [
            { n: "Первый канал UHD", g: "новости", u: "http://rossteleccom.net" },
            { n: "Россия 1 UHD", g: "новости", u: "http://rossteleccom.net" },
            { n: "НТВ UHD", g: "новости", u: "http://rossteleccom.net" },
            { n: "Крик ТВ HD", g: "новости", u: "http://rossteleccom.net" },
            { n: "Sky Sports News HD 50 UK", g: "новости", u: "http://rossteleccom.net" },
            { n: "РБК HD 50", g: "новости", u: "http://rossteleccom.net" },
            { n: "Первый канал", g: "новости", u: "http://rossteleccom.net" },
            { n: "Россия 1", g: "новости", u: "http://rossteleccom.net" },
            { n: "Россия 24", g: "новости", u: "http://rossteleccom.net" },
            { n: "РЕН ТВ UHD", g: "кино", u: "http://rossteleccom.net" },
            { n: "VF Сериалы Турции", g: "кино", u: "http://rossteleccom.net" },
            { n: "9-1-1 HD", g: "кино", u: "http://rossteleccom.net" },
            { n: "Viju TV1000 Русское", g: "кино", u: "http://rossteleccom.net" },
            { n: "Кинохит", g: "кино", u: "http://rossteleccom.net" },
            { n: "Amedia Premium", g: "кино", u: "http://rossteleccom.net" },
            { n: "1HD Music Television HD", g: "музыка", u: "http://rossteleccom.net" },
            { n: "Europa Plus TV HD", g: "музыка", u: "http://rossteleccom.net" },
            { n: "МУЗ-ТВ", g: "музыка", u: "http://rossteleccom.net" },
            { n: "Шансон ТВ", g: "музыка", u: "http://rossteleccom.net" },
            { n: "Карусель HD", g: "детские", u: "http://rossteleccom.net" },
            { n: "Nickelodeon HD", g: "детские", u: "http://rossteleccom.net" },
            { n: "Мульт HD", g: "детские", u: "http://rossteleccom.net" },
            { n: "ТНТ UHD", g: "развлекательные", u: "http://rossteleccom.net" },
            { n: "Пятница! HD", g: "развлекательные", u: "http://rossteleccom.net" },
            { n: "СТС HD", g: "развлекательные", u: "http://rossteleccom.net" },
            { n: "Sky Sports Tennis HD 50 UK", g: "спорт", u: "http://rossteleccom.net" },
            { n: "Окко Футбол UHD", g: "спорт", u: "http://rossteleccom.net" },
            { n: "Eurosport 1 UHD", g: "спорт", u: "http://rossteleccom.net" },
            { n: "Матч ТВ HD", g: "спорт", u: "http://rossteleccom.net" },
            { n: "Матч! Премьер HD", g: "спорт", u: "http://rossteleccom.net" },
            { n: "Setanta Sports 1 HD", g: "спорт", u: "http://rossteleccom.net" },
            { n: "1+1 Україна HD UA", g: "українські", u: "http://rossteleccom.net" },
            { n: "Новий Канал HD UA", g: "українські", u: "http://rossteleccom.net" },
            { n: "ICTV HD UA", g: "українські", u: "http://rossteleccom.net" },
            { n: "Moldova 1 HD MD", g: "moldovenească", u: "http://rossteleccom.net" },
            { n: "Jurnal TV HD MD", g: "moldovenească", u: "http://rossteleccom.net" },
            { n: "Беларусь 24 HD BY", g: "беларускія", u: "http://rossteleccom.net" }
        ];

        const video = document.getElementById('video');
        let hls = null;

        window.onload = function() {
            buildCategories();
            filterCategory('ALL');
        };

        function buildCategories() {
            const select = document.getElementById('category-select');
            const groups = new Set();
            RAW_PLAYLIST.forEach(item => { if(item.g) groups.add(item.g); });
            groups.forEach(group => {
                const opt = document.createElement('option');
                opt.value = group;
                opt.innerText = group.toUpperCase();
                select.appendChild(opt);
            });
        }

        function filterCategory(category) {
            const listContainer = document.getElementById('channels-list');
            listContainer.innerHTML = '';

            const filtered = category === 'ALL' 
                ? RAW_PLAYLIST 
                : RAW_PLAYLIST.filter(item => item.g === category);

            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerText = item.n;
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(item.u);
                };
                listContainer.appendChild(li);
            });
        }

        function playStream(url) {
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            } else {
                alert('Формат не поддерживается');
            }
        }
    </script>
</body>
</html>
