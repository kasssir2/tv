<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT-play FOSS Personal Light</title>
    <!-- Правильное и полное подключение видео-движка HLS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #0b0b0c; color: #e1e1e3; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #sidebar { width: 340px; background: #131316; border-right: 1px solid #232329; display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
        .header-box { padding: 20px; background: #1a1a22; text-align: center; font-weight: bold; border-bottom: 1px solid #232329; font-size: 16px; color: #00a2ff; letter-spacing: 1px; }
        .config-box { padding: 15px; background: #16161d; border-bottom: 1px solid #232329; display: flex; flex-direction: column; gap: 10px; }
        input[type="text"], select, input[type="file"] { background: #202026; color: #fff; border: 1px solid #33333f; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; transition: 0.2s; width: calc(100% - 22px); }
        button { background: #00a2ff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        button:hover { background: #0082cc; }
        #channels-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .channel-item { padding: 14px 20px; border-bottom: 1px solid #1c1c24; cursor: pointer; display: flex; align-items: center; transition: 0.15s; font-size: 14px; color: #b5b5bd; }
        .channel-item:hover { background: #1c1c24; color: #fff; }
        .channel-item.active { background: #00a2ff; color: #fff; font-weight: bold; }
        #video-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .file-label { font-size: 12px; color: #888; margin-bottom: -5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header-box">OTT-PLAY FOSS LIGHT</div>
        
        <div class="config-box">
            <input type="text" id="playlist-url" placeholder="Вставьте ссылку на .m3u / .m3u8">
            <button onclick="loadFromUrl()">Загрузить по ссылке</button>
            
            <div class="file-label">Или выберите файл плейлиста:</div>
            <input type="file" id="playlist-file" accept=".m3u,.m3u8" onchange="loadFromFile(this)">
            
            <select id="category-select" style="display:none;" onchange="filterCategory(this.value)"></select>
        </div>

        <ul id="channels-list">
            <li class="channel-item" style="color:#666; pointer-events:none;">Плейлист не загружен</li>
        </ul>
    </div>

    <div id="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = null;
        let allChannels = [];

        window.onload = function() {
            const savedUrl = localStorage.getItem('ott_foss_url');
            if (savedUrl) {
                document.getElementById('playlist-url').value = savedUrl;
                loadFromUrl(savedUrl);
            }
        };

        async function loadFromUrl(forcedUrl = null) {
            const url = forcedUrl || document.getElementById('playlist-url').value.trim();
            if (!url) return alert('Введите ссылку на плейлист!');
            
            localStorage.setItem('ott_foss_url', url);
            updateStatus('Загрузка потоков...');

            try {
                // Обход блокировок чтения файлов на некоторых устройствах
                const proxyUrl = 'https://allorigins.win' + encodeURIComponent(url);
                const response = await fetch(proxyUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                alert('Ошибка сети при загрузке ссылки. Попробуйте загрузить сохраненный плейлист файлом.');
            }
        }

        function loadFromFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            updateStatus('Чтение файла...');
            const reader = new FileReader();
            reader.onload = function(e) {
                parseM3U(e.target.result);
            };
            reader.readAsText(file);
        }

        function updateStatus(text) {
            document.getElementById('channels-list').innerHTML = `<li class="channel-item" style="color:#aaa; pointer-events:none;">${text}</li>`;
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const groups = new Set();
            allChannels = [];
            
            let currentName = '';
            let currentGroup = 'Общие';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1] || 'Без названия';
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentGroup = groupMatch[1];
                } else if (line.startsWith('#EXTGRP:')) {
                    currentGroup = line.replace('#EXTGRP:', '').trim();
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        allChannels.push({ n: currentName, g: currentGroup, u: line });
                        groups.add(currentGroup);
                    }
                    currentName = '';
                }
            });

            if (allChannels.length === 0) {
                updateStatus('Каналы не найдены. Неверный формат файла.');
                return;
            }

            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="ALL">-- ВСЕ КАНАЛЫ --</option>';
            groups.forEach(group => {
                const opt = document.createElement('option');
                opt.value = group;
                opt.innerText = group.toUpperCase();
                select.appendChild(opt);
            });
            select.style.display = 'block';

            filterCategory('ALL');
        }

        function filterCategory(category) {
            const listContainer = document.getElementById('channels-list');
            listContainer.innerHTML = '';

            const filtered = category === 'ALL' 
                ? allChannels 
                : allChannels.filter(item => item.g === category);

            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.innerText = item.n;
                li.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    playStream(item.u);
                };
                listContainer.appendChild(li);
            });
        }

        function playStream(url) {
            // Исправление блокировки Mixed Content (автозамена протоколов при необходимости)
            if (window.location.protocol === 'https:' && url.startsWith('http://') && !url.includes('rossteleccom.net')) {
                url = url.replace('http://', 'https://');
            }

            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false; // Отключаем куки для совместимости со старыми ТВ
                    }
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => video.controls = true));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            } else {
                alert('Плеер не поддерживается типом прошивки вашего ТВ.');
            }
        }
    </script>
</body>
</html>
